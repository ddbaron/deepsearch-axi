[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsearch-axi"
version = "0.2.1"
description = "Agent-native CLI for DeepSeek web search and page fetch with compact TOON output."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Derek Baron" }]
dependencies = ["toon-format>=1.2,<2"]

[project.urls]
Repository = "https://github.com/ddbaron/deepsearch-axi"

[project.scripts]
deepsearch-axi = "deepsearch_axi.cli:main"

[tool.setuptools]
packages = ["deepsearch_axi"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["acceptance-checks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
