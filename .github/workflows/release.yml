name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    name: release (ubuntu-latest, py3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      stable: ${{ steps.github-release.outputs.stable }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $version; expected tag v$version."
            exit 1
          fi
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Project end-to-end tests
        run: python -m pytest -q
      - name: Human-owned offline acceptance
        run: python acceptance-checks/run.py --exe "$(command -v deepsearch-axi)"
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          overwrite: true
      - name: Publish GitHub release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            flag="--latest"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            flag="--prerelease"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets and title."
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TAG"
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes "$flag"
          fi

  publish-pypi:
    name: publish to PyPI
    needs: release
    # Reuses the release job's stable tag test, ^v[0-9]+(\.[0-9]+)*$, so
    # pre-release tags such as v0.3.0rc1 never reach PyPI.
    if: needs.release.outputs.stable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deepsearch-axi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          # PyPI versions cannot be reused, so a re-run skips files that are
          # already uploaded instead of failing on the duplicate.
          skip-existing: true
