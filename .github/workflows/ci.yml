name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  DEEPSEARCH_AXI_NETGUARD: "1"

jobs:
  test:
    name: test (ubuntu-latest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Offline behavioral tests
        env:
          DEEPSEARCH_AXI_NETGUARD: "1"
          DEEPSEARCH_AXI_EVIDENCE_DIR: ${{ github.workspace }}/tests/fixtures/evidence
        run: python -m pytest -q
      - name: Native plugin adapter tests
        run: python -m pytest -q tests/test_opencode.py

  macos:
    name: macOS POSIX checks
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Offline behavioral tests
        env:
          DEEPSEARCH_AXI_NETGUARD: "1"
          DEEPSEARCH_AXI_EVIDENCE_DIR: ${{ github.workspace }}/tests/fixtures/evidence
        run: python -m pytest -q

  lint:
    name: lint and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip install rumdl==0.2.66
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Markdown lint
        run: rumdl check --disable MD013 README.md .agents/skills/deepsearch-axi/SKILL.md
      - name: Generated skill freshness
        run: python scripts/generate_skill.py --check

  package:
    name: package build and installation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip install pipx uv
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Provision local wheelhouse
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse toon-format==1.2.0 "tomlkit>=0.13.3,<1"
          cp dist/*.whl wheelhouse/
      - name: Installed package tests
        env:
          DEEPSEARCH_AXI_NETGUARD: "1"
        run: python -m pytest -q tests/test_packaging.py tests/test_installation.py
